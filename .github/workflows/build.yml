name: build
on: [push, pull_request]
jobs:
  windows-ucrt64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: diffutils make mingw-w64-ucrt-x86_64-gcc
      - name: Download Eigen
        run: |
          curl -LO https://gitlab.com/libeigen/eigen/-/archive/5.0.1/eigen-5.0.1.tar.bz2
          tar -xf eigen-5.0.1.tar.bz2
          mv eigen-5.0.1/Eigen eigen/Eigen
      - name: Build and Test
        run: make -j
      - uses: actions/upload-artifact@v7
        with:
          name: windows-ucrt64-build
          path: libpazmath.a
  windows-clang64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: diffutils make mingw-w64-clang-x86_64-clang
      - name: Download Eigen
        run: |
          curl -LO https://gitlab.com/libeigen/eigen/-/archive/5.0.1/eigen-5.0.1.tar.bz2
          tar -xf eigen-5.0.1.tar.bz2
          mv eigen-5.0.1/Eigen eigen/Eigen
      - name: Build and Test
        run: make -j
      - uses: actions/upload-artifact@v7
        with:
          name: windows-clang64-build
          path: libpazmath.a
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download Eigen
        run: |
          curl -LO https://gitlab.com/libeigen/eigen/-/archive/5.0.1/eigen-5.0.1.tar.bz2
          tar -xf eigen-5.0.1.tar.bz2
          mv eigen-5.0.1/Eigen eigen/Eigen
      - name: Build and Test
        run: make -j
      - uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: libpazmath.a
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download Eigen
        run: |
          curl -LO https://gitlab.com/libeigen/eigen/-/archive/5.0.1/eigen-5.0.1.tar.bz2
          tar -xf eigen-5.0.1.tar.bz2
          mv eigen-5.0.1/Eigen eigen/Eigen
      - name: Build and Test
        run: make -j
      - uses: actions/upload-artifact@v7
        with:
          name: linux-build
          path: libpazmath.a
